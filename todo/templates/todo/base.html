<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Todo App
      {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'index' %}">Todo System</a>
        <div class="navbar-nav ms-auto align-items-center">
          {% if user.is_authenticated %}
            <span class="nav-item text-white me-3">Xin chào, <strong>{{ user.username }}</strong></span>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-light btn-sm">Đăng xuất</button>
            </form>
          {% else %}
            <a class="btn btn-outline-light me-2 btn-sm" href="{% url 'login' %}">Đăng nhập</a>
            <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Đăng ký</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <div class="container">
      {% block content %}
      {% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}
    {% endblock %}
  </body>
</html>
